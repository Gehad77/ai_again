<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · إنشاء متجر</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="auth-shell"><section class="card auth-card"><h1>اعملي متجرك على Relay</h1>
<p>هيكون ليكي رابط للمتجر وداشبورد للطلبات والمحادثات.</p>
<form id="start-store">
<label>اسم المتجر<input name="name" maxlength="80" required></label>
<label>عنوان المتجر<input name="slug" dir="ltr" pattern="[a-z0-9][a-z0-9\-]{1,38}[a-z0-9]" placeholder="my-shop" minlength="3" maxlength="40" required></label>
<label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
<label>كلمة المرور<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<p class="form-error" role="alert"></p><button class="primary">إنشاء المتجر</button></form>
<div id="store-created" hidden><h2>متجرك اتعمل</h2><p><a id="store-admin">دخول لوحة التحكم</a></p>
<p><a id="store-catalog">فتح واجهة المتجر</a></p></div>
</section></main><script type="module" src="/start-store.js"></script><footer class="privacy-link"><a href="/privacy" lang="ar" dir="rtl">سياسة الخصوصية</a></footer></body></html>
