services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - relay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_crm"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  relay_postgres:
